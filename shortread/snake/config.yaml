samples:
  ILS_1: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373584/373584_S1_R1_001.fastq.gz
  ILS_2: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373585/373585_S2_R1_001.fastq.gz
  ILS_3: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373586/373586_S3_R1_001.fastq.gz
  DIS_1: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373587/373587_S4_R1_001.fastq.gz
  DIS_2: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373588/373588_S5_R1_001.fastq.gz
  DIS_3: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373589/373589_S6_R1_001.fastq.gz

references:
  rrna_fasta: /groups/plaschka/rupert.faraway/reference/hs/rdna/rdna.fa
  snrna_fasta: /groups/plaschka/rupert.faraway/reference/hs/snrna/gc44.basic.snrna.fa
  genome_fasta: /groups/plaschka/rupert.faraway/reference/hs/fa/GRCh38.primary_assembly.genome.fa
  genome_gtf: /groups/plaschka/rupert.faraway/reference/hs/annotation/gencode.v44.primary_assembly.basic.annotation.gtf

trim:
  min_length_r1: 30
  min_length_r2: 15
  poly_g_min: 6
  poly_a_min: 10
  times: 3
  adapter_min_overlap: 4 # Prevent short terminal motifs such as a genuine R1 splice-site AG from matching adapters.
  r2_fixed_5p_sequence: GTCCTG
  r2_3p_adapter: N{15}AGATCGGAAGAGCGTCGTGC
  r2_adapter_min_overlap: 23 # 15 wildcard bases + at least 8 fixed adapter bases.
  r2_adapter_error_rate: 0.2
  illumina_3p_adapters:
    - AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
    - AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
    - CAGGACAGATCGGAAGAGCACACGTCTGA # This one includes an extension specific to my RT primer.
  extra: ""

umi:
  extract_method: string
  bc_pattern: "NNNNNXXXXXXNNNN" # 5N + CGTGAT + 4N; string mode keeps the fixed 6mer on-read.
  fixed_5p_sequence: CGTGAT
  fixed_5p_error_rate: 0.2

premap:
  preset: "--very-sensitive-local"
  extra: ""

star:
  # Set this to read_length - 1 for the raw sequencing read length.
  sjdb_overhang: 149
  genome_sa_index_nbases: 14
  limit_bam_sort_ram: 24000000000
  genome_generate_extra: ""
  align_extra: "--twopassMode Basic --alignEndsType Local --outFilterScoreMinOverLread 0.45 --outFilterMatchNminOverLread 0.45"

dedup:
  method: directional
  multimapping_detection_method: NH
  samtools_sort_memory: 8G
  extra: ""

branchpoint_analysis:
  mane_gtf: annotation/gencode.v44.primary_assembly.basic.annotation.gtf.gz
  branchpoints: annotation/colaseq_branchpoints_scores.txt
  anchor_window: 5
  profile_upstream: 100
  profile_downstream: 100
  shared_min_reads_all_samples: 5

qualimap:
  java_mem: 16G
  slurm_mem: 24G
  protocol: non-strand-specific

slurm:
  time_limits:
    short: "08:00:00"
    medium: "2-00:00:00"
  sbatch_extra: ""

resources:
  trim_threads: 8
  bowtie2_build_threads: 8
  premap_threads: 16
  star_index_threads: 16
  star_map_threads: 16
  dedup_sort_threads: 8
  samtools_index_threads: 4
  fastqc_threads: 2
  bam_qc_threads: 2
  rna_content_threads: 4
  snrna_count_threads: 2
  branchpoint_reference_threads: 1
  branchpoint_quant_threads: 1
  branchpoint_aggregate_threads: 1
