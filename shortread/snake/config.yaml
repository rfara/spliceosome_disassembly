samples:
  ILS_1: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373584/373584_S1_R1_001.fastq.gz
  ILS_2: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373585/373585_S2_R1_001.fastq.gz
  ILS_3: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373586/373586_S3_R1_001.fastq.gz
  DIS_1: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373587/373587_S4_R1_001.fastq.gz
  DIS_2: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373588/373588_S5_R1_001.fastq.gz
  DIS_3: shortread/reads/23GLCKLT3_8_R20155_20260321/demultiplexed/373589/373589_S6_R1_001.fastq.gz

references:
  rrna_fasta: /groups/plaschka/rupert.faraway/reference/hs/rdna/rdna.fa
  snrna_fasta: /groups/plaschka/rupert.faraway/reference/hs/snrna/gc44.basic.snrna.fa
  genome_fasta: /groups/plaschka/rupert.faraway/reference/hs/fa/GRCh38.primary_assembly.genome.fa
  genome_gtf: /groups/plaschka/rupert.faraway/reference/hs/annotation/gencode.v44.primary_assembly.basic.annotation.gtf

trim:
  min_length_r1: 30
  min_length_r2: 15
  poly_g_min: 6
  poly_a_min: 10
  times: 3
  adapter_min_overlap: 4 # Prevent short terminal motifs such as a genuine R1 splice-site AG from matching adapters.
  r2_fixed_5p_sequence: GTCCTG
  r2_3p_adapter: N{15}AGATCGGAAGAGCGTCGTGC
  r2_adapter_min_overlap: 23 # 15 wildcard bases + at least 8 fixed adapter bases.
  r2_adapter_error_rate: 0.2
  illumina_3p_adapters:
    - AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
    - AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
    - CAGGACAGATCGGAAGAGCACACGTCTGA # This one includes an extension specific to my RT primer.
  extra: ""

umi:
  extract_method: string
  bc_pattern: "NNNNNXXXXXXNNNN" # 5N + CGTGAT + 4N; string mode keeps the fixed 6mer on-read.
  fixed_5p_sequence: CGTGAT
  fixed_5p_error_rate: 0.2

premap:
  preset: "--very-sensitive-local"
  extra: ""

star:
  # Set this to read_length - 1 for the raw sequencing read length.
  sjdb_overhang: 149
  genome_sa_index_nbases: 14
  limit_bam_sort_ram: 24000000000
  genome_generate_extra: ""
  align_extra: "--twopassMode Basic --alignEndsType Local --outFilterScoreMinOverLread 0.45 --outFilterMatchNminOverLread 0.45"

dedup:
  method: directional
  multimapping_detection_method: NH
  samtools_sort_memory: 8G
  extra: "--chimeric-pairs=discard --unpaired-reads=discard"

branchpoint_analysis:
  mane_gtf: annotation/gencode.v44.primary_assembly.basic.annotation.gtf.gz
  branchpoints: annotation/colaseq_branchpoints_scores.txt
  anchor_window: 5
  profile_upstream: 100
  profile_downstream: 100
  plot_upstream: 50
  plot_downstream: 10
  canonical_branchpoint_motif: YUNAY
  three_prime_coverage_upstream: 100
  three_prime_coverage_downstream: 100
  shared_min_reads_all_samples: 5
  readthrough_profile_upstream: 100
  readthrough_profile_downstream: 100
  readthrough_shared_min_reads_all_samples: 5
  readthrough_plot_upstream: 40
  readthrough_plot_downstream: 10
  readthrough_blacklist_min_samples: 2
  readthrough_blacklist_min_traversing_fragments: 20
  readthrough_blacklist_deletion_percent_threshold: 0.5
  readthrough_blacklist_insertion_percent_threshold: 0.5
  readthrough_max_total_indel_percent_any_sample: 0.5
  readthrough_blacklist_single_offset_min_samples: 2
  readthrough_blacklist_single_offset_min_coverage: 20
  readthrough_blacklist_single_offset_deletion_percent_threshold: 10.0
  readthrough_blacklist_single_offset_insertion_percent_threshold: 10.0
  heterogeneity_signal_field: zero_or_plus_one_branchpoint_fragments
  heterogeneity_query_condition: DIS
  heterogeneity_control_condition: ILS
  heterogeneity_sample_min_reads: 10
  heterogeneity_condition_min_reads: 20
  heterogeneity_bootstraps: 500
  heterogeneity_seed: 1
  sequence_context_genome_fasta: /Users/rupert.faraway/bio/reference/hs/fa/GRCh38.primary_assembly.genome.fa
  sequence_context_signal_field: zero_or_plus_one_branchpoint_fragments
  sequence_context_control_condition: ILS
  sequence_context_query_condition: DIS
  sequence_context_control_min_reads: 20
  sequence_context_query_min_reads: 20
  sequence_context_bp_upstream: 5
  sequence_context_bp_downstream: 5
  sequence_context_five_prime_intron_bases: 6
  sequence_context_decile_fraction: 0.1
  sequence_context_require_bp_center_base: A
  relative_feature_genome_fasta: /Users/rupert.faraway/bio/reference/hs/fa/GRCh38.primary_assembly.genome.fa
  relative_feature_signal_field: zero_or_plus_one_branchpoint_fragments
  relative_feature_control_condition: ILS
  relative_feature_query_condition: DIS
  relative_feature_control_min_reads: 20
  relative_feature_query_min_reads: 20
  relative_feature_require_bp_center_base: A
  relative_feature_bp_upstream: 5
  relative_feature_bp_downstream: 5
  relative_feature_intron_gc_window: 100
  relative_feature_three_prime_window: 20
  relative_feature_residual_quantile_fraction: 0.1

slurm:
  time_limits:
    short: "08:00:00"
    medium: "2-00:00:00"
  sbatch_extra: ""

resources:
  trim_threads: 8
  bowtie2_build_threads: 8
  premap_threads: 16
  star_index_threads: 16
  star_map_threads: 16
  dedup_sort_threads: 8
  samtools_index_threads: 4
  fastqc_threads: 2
  bam_qc_threads: 2
  rna_content_threads: 4
  snrna_count_threads: 2
  branchpoint_reference_threads: 1
  branchpoint_quant_threads: 1
  branchpoint_aggregate_threads: 1
  branchpoint_readthrough_quant_threads: 1
  branchpoint_readthrough_aggregate_threads: 1
  branchpoint_heterogeneity_threads: 1
  branchpoint_sequence_context_threads: 1
  branchpoint_relative_feature_threads: 1
