raw_reads:
  geo_accession: GSE329374
  r1_pattern: shortread/reads/{sample}_R1.fastq.gz
  r2_pattern: shortread/reads/{sample}_R2.fastq.gz

references:
  rrna_fasta: annotation/rdna.fa
  snrna_fasta: annotation/gc44.basic.snrna.fa
  genome_fasta: shortread/results/reference/genome/GRCh38.primary_assembly.genome.fa
  genome_fasta_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_44/GRCh38.primary_assembly.genome.fa.gz
  genome_fasta_md5: 9c3fc2ca260a767530dddb0f26721a6b
  genome_gtf: annotation/gencode.v44.primary_assembly.basic.annotation.gtf.gz

trim:
  min_length_r1: 30
  min_length_r2: 15
  poly_g_min: 6
  poly_a_min: 10
  times: 3
  adapter_min_overlap: 4 # Prevent short terminal motifs such as a genuine R1 splice-site AG from matching adapters.
  r2_fixed_5p_sequence: GTCCTG
  r2_3p_adapter: N{15}AGATCGGAAGAGCGTCGTGC
  r2_adapter_min_overlap: 23 # 15 wildcard bases + at least 8 fixed adapter bases.
  r2_adapter_error_rate: 0.2
  illumina_3p_adapters:
    - AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
    - AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
    - CAGGACAGATCGGAAGAGCACACGTCTGA # This one includes an extension specific to my RT primer.
  extra: ""

umi:
  extract_method: string
  bc_pattern: "NNNNNXXXXXXNNNN" # 5N + CGTGAT + 4N; string mode keeps the fixed 6mer on-read.
  fixed_5p_sequence: CGTGAT
  fixed_5p_error_rate: 0.2

premap:
  preset: "--very-sensitive-local"
  extra: ""

star:
  # Set this to read_length - 1 for the raw sequencing read length.
  sjdb_overhang: 149
  genome_sa_index_nbases: 14
  limit_bam_sort_ram: 24000000000
  genome_generate_extra: ""
  align_extra: "--twopassMode Basic --alignEndsType Local --outFilterScoreMinOverLread 0.45 --outFilterMatchNminOverLread 0.45"

dedup:
  method: directional
  multimapping_detection_method: NH
  samtools_sort_memory: 8G
  extra: "--chimeric-pairs=discard --unpaired-reads=discard"

branchpoint_analysis:
  mane_gtf: annotation/gencode.v44.primary_assembly.basic.annotation.gtf.gz
  branchpoints: annotation/colaseq_branchpoints_scores.txt
  anchor_window: 10
  anchor_upstream: 10
  anchor_downstream: 1
  downstream_exon_min_offset: 5
  profile_upstream: 100
  profile_downstream: 100
  three_prime_coverage_upstream: 100
  three_prime_coverage_downstream: 100
  min_anchored_reads_all_samples_for_analysis_inclusion: 0

premrna_analysis:
  mane_gtf: annotation/gencode.v44.primary_assembly.basic.annotation.gtf.gz
  metaprofile_upstream: 200
  metaprofile_downstream: 200
  shared_min_total_reads_all_samples: 10

slurm:
  time_limits:
    short: "08:00:00"
    medium: "2-00:00:00"
  sbatch_extra: ""

resources:
  download_threads: 8
  trim_threads: 8
  bowtie2_build_threads: 8
  premap_threads: 16
  star_index_threads: 16
  star_map_threads: 16
  dedup_sort_threads: 8
  samtools_index_threads: 4
  fastqc_threads: 2
  bam_qc_threads: 2
  rna_content_threads: 4
  premrna_reference_threads: 1
  premrna_quant_threads: 2
  premrna_aggregate_threads: 1
  branchpoint_reference_threads: 1
  branchpoint_quant_threads: 1
  branchpoint_aggregate_threads: 1
